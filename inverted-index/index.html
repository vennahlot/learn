<!DOCTYPE html>
<html lang="en">
<head>

<title>How search works: the inverted index · 搜索是怎么工作的：倒排索引</title>
<meta name="description" content="An interactive, bilingual lesson: build an inverted index step by step and use it for AND, OR, phrase and ranked search.">
<style>
*{box-sizing:border-box}
:root{--bg:#f5f6f8;--card:#fff;--ink:#1f2633;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--hl:#fff4c2;--ok:#059669;--bad:#dc2626;--c1:#7c3aed;--c2:#0d9488;--c3:#d97706}

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.top a.home{text-decoration:none;color:var(--mute);font-size:20px;line-height:1}
select,.btn{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
main{max-width:1180px;margin:0 auto;padding:16px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.stepper{display:flex;align-items:center;gap:12px;margin-bottom:14px}

.dot{width:12px;height:12px;border-radius:50%;background:#d1d5db;border:0;padding:0;cursor:pointer}
.dot.done{background:#93c5fd}.dot.cur{background:var(--acc);transform:scale(1.35)}
.kbd{color:var(--mute);font-size:12.5px}
.story .n{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.story h2{margin:4px 0 8px;font-size:22px;line-height:1.3}
.story p{margin:8px 0}
.story ul{margin:6px 0;padding-left:20px}.story li{margin:4px 0}
.tip-box{background:#eff6ff;border-left:4px solid var(--acc);border-radius:8px;padding:10px 14px;margin-top:10px}
.kw{background:#fffbeb;border:1px solid #fcd34d;border-radius:5px;padding:0 5px;font-weight:700;white-space:nowrap}
.panels{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:start}
.panel{border-top:4px solid var(--c);margin-bottom:0}
.panel.hitp{box-shadow:0 0 0 2px #fde68a}
.sec-title{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-bottom:8px}
.none{color:#9ca3af;font-style:italic;font-size:14px}
.doc{padding:8px 10px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;transition:background .3s}
.doc .id{display:inline-block;font-weight:800;color:var(--c1);margin-right:6px}
.doc.cur{background:var(--hl);border-color:#facc15}
.doc.hit{border-color:var(--ok);background:#ecfdf5}
.doc.miss{opacity:.5}
.doc.del .txt{text-decoration:line-through;opacity:.5}
.doc .badge{float:right;font-weight:800;margin-left:6px}
.doc .badge.ok{color:var(--ok)}.doc .badge.bad{color:var(--bad)}.doc .badge.del{color:var(--mute);font-size:12px;font-weight:600}
.doc.new{animation:fadein .6s ease both}
mark{background:#fde68a;border-radius:3px;padding:0 1px;color:inherit}
.toks{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tok{font-size:13.5px;border:1px solid #c7d2fe;background:#eef2ff;border-radius:6px;padding:1px 6px;animation:pop .4s ease both}
.tok small{color:var(--mute);margin-left:3px;font-size:11px}
.tok.stop{text-decoration:line-through;opacity:.45;background:#f3f4f6;border-color:var(--line)}
table.ix{width:100%;border-collapse:collapse}
.ix th{font-size:12px;color:var(--mute);text-align:left;font-weight:600;padding:2px 4px;border-bottom:1px solid var(--line)}
.ix td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top;font-size:14px}
.ix td.t{font-weight:700;white-space:nowrap}
.ix td.df{color:var(--mute);text-align:center;width:30px}

.pg{display:inline-block;margin:1px 3px 2px 0;padding:0 6px;border-radius:6px;background:#f0fdfa;border:1px solid #99f6e4;font-size:13px;white-space:nowrap}
.pg small{color:var(--mute);margin-left:3px;font-size:11px}
.pg.del{text-decoration:line-through;opacity:.45}
.pg.on{background:#fde68a;border-color:#f59e0b}
.pg.new{animation:pop .5s ease .3s both;background:#dcfce7;border-color:#22c55e}
.qbox{font-size:17px;font-weight:700;background:#fffbeb;border:1px dashed var(--c3);border-radius:8px;padding:6px 10px;margin-bottom:10px}
.qbox .mode{font-size:12px;font-weight:600;color:var(--c3);margin-left:6px;white-space:nowrap}
.plist{margin:10px 0 18px}
.plist .lab{font-weight:700;margin-bottom:4px;font-size:14px}
.cells{display:flex;gap:5px;flex-wrap:wrap}
.cell{position:relative;min-width:40px;text-align:center;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.cell.ptr{border-color:var(--acc);box-shadow:0 0 0 2px #bfdbfe;font-weight:800}
.cell.ptr::after{content:"▲";position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);color:var(--acc);font-size:11px}
.cell.match{background:#d1fae5;border-color:var(--ok)}
.cell.gone{opacity:.35;text-decoration:line-through}
.cmp{font-size:14px;margin:8px 0;padding:8px 10px;background:#f9fafb;border-radius:8px;border:1px solid var(--line)}
.res{font-weight:700;margin-top:8px}
table.sc{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
.sc th,.sc td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:center}
.sc th{font-size:12px;color:var(--mute);font-weight:600}
.sc td:first-child,.sc th:first-child{text-align:left}
.sc tr.top1 td{background:#ecfdf5;font-weight:700}
.big{font-size:22px;font-weight:800}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.vs div{border-radius:10px;padding:10px;text-align:center;border:1px solid var(--line)}
.vs .slow{background:#fef2f2}.vs .fast{background:#ecfdf5}
.ok{color:var(--ok);font-weight:800;margin-right:4px}
.bad{color:var(--bad);font-weight:800;margin-right:4px}
.try{border-top:4px solid var(--acc)}
.try input{font:inherit;font-size:16px;padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;width:100%}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.ex button{font:inherit;font-size:13.5px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:#f9fafb;cursor:pointer}
.ex button:hover{border-color:var(--acc);color:var(--acc)}
.tryout{margin-top:10px}
.tryout .how{font-size:14px;color:var(--mute);margin:6px 0}
.score{float:right;font-size:12px;color:var(--mute);margin-left:6px}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
@keyframes flash{0%{background:#bbf7d0}100%{background:transparent}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1}}
.term{border-bottom:1.5px dotted #6b7280;cursor:help}
.term:hover{color:var(--acc);border-bottom-color:var(--acc)}
#tip{position:absolute;z-index:50;max-width:340px;background:#1f2633;color:#fff;border-radius:10px;padding:10px 26px 10px 14px;font-size:13.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tip b{display:block;margin-bottom:3px;font-size:14px}
#tip::before{content:"";position:absolute;top:-6px;left:var(--ax,20px);border:6px solid transparent;border-top:0;border-bottom-color:#1f2633}
#tip .x{position:absolute;right:9px;top:5px;cursor:pointer;opacity:.7}
dialog{border:none;border-radius:14px;padding:0;width:min(560px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.dlg-b{padding:14px 18px;max-height:65vh;overflow:auto}
.dlg-b p{margin:8px 0}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.legend{display:flex;gap:8px;margin:10px 0}
.legend div{flex:1;border-radius:10px;padding:8px 10px;color:#fff;font-size:13px}
select.lang{min-width:0}
.pos,.stabs{display:none}
@media (max-width:980px){.panels{grid-template-columns:1fr}}
/* ---------- phones ---------- */
@media (max-width:700px){
  body{font-size:16px}
  .top{position:static;padding:10px 12px;gap:8px}
  .top h1{font-size:16px;flex:1 1 0;min-width:0;margin:0}
  select.lang{padding:6px}
  .top label{order:2;flex:1 1 100%;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .top label select{flex:1;min-width:0}
  .top .btn{order:3;flex:1 1 0;padding:8px 4px;font-size:14px}
  select{font-size:16px}
  main{padding:12px 10px calc(90px + env(safe-area-inset-bottom))}
  .card{padding:14px}
  .stepper{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.07);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .stepper .btn{flex:1;padding:13px 8px;font-size:17px;border-radius:10px}
  .dots,.stepper .kbd{display:none}
  .pos{display:block;font-size:14px;color:var(--mute);white-space:nowrap;text-align:center}
  .story h2{font-size:20px}
  .tip-box{padding:10px 12px}
  .stabs{display:flex;gap:6px;margin-bottom:10px}
  .stabs button{flex:1 1 0;font:inherit;font-size:14px;line-height:1.25;padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--mute);border-top:4px solid var(--c);position:relative}
  .stabs button.on{color:var(--ink);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .stabs .hitdot{position:absolute;top:-7px;right:-3px;width:12px;height:12px;border-radius:50%;background:#facc15;border:2px solid #fff}
  .panels{display:block}
  .panels .panel{display:none}
  .panels .panel.on{display:block}
  .panel.hitp{box-shadow:none}
  .ix td{font-size:15px}
  .pg{font-size:14px}
  .legend{flex-direction:column}
  #tip{font-size:15px}
}
</style>

<body>
<div class="top">
  <a class="home" href="../" title="All lessons / 全部课程">⌂</a>
  <h1 data-t="h1">How search works: the inverted index</h1>
  <label><span data-t="scenario">Scenario:</span> <select id="scen"></select></label>
  <button class="btn" id="howBtn" data-t="how">? How to read this</button>
  <select id="lang" class="lang" aria-label="Language / 语言"><option value="en">🌐 English</option><option value="zh">🌐 简体中文</option></select>
</div>
<main>
  <div class="stepper">
    <button class="btn" id="prev" data-t="prev">← Back</button>
    <div class="dots" id="dots"></div>
    <span class="kbd" data-t="keys">← → keys work too</span>
    <span class="pos" id="pos"></span>
    <button class="btn primary" id="next">Next →</button>
  </div>
  <div class="card story" id="story"></div>
  <div class="stabs" id="stabs"></div>
  <div class="panels" id="panels">
    <div class="card panel" data-k="docs" style="--c:var(--c1)"><div class="sec-title" data-t="docsTitle">Documents</div><div id="docs"></div></div>
    <div class="card panel" data-k="index" style="--c:var(--c2)"><div class="sec-title" data-t="indexTitle">Inverted index</div><div id="index"></div></div>
    <div class="card panel" data-k="query" style="--c:var(--c3)"><div class="sec-title" data-t="queryTitle">Search</div><div id="query"></div></div>
  </div>
  <div class="card try" style="margin-top:14px">
    <div class="sec-title" data-t="tryTitle">Try your own search</div>
    <div class="kbd" data-t="tryHint" style="font-size:14px"></div>
    <div class="ex" id="examples"></div>
    <input id="tryq" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search">
    <div class="tryout" id="tryout"></div>
  </div>
</main>

<div id="tip" hidden></div>

<dialog id="howDlg"><form method="dialog">
  <div class="dlg-h" data-t="howTitle">How to read this page</div>
  <div class="dlg-b" data-t="howBody"></div>
  <div class="dlg-f"><button class="btn primary" value="ok" data-t="gotIt">Got it</button></div>
</form></dialog>

<script>
'use strict';
// ---------- language ----------
const HAS_DOM = typeof document !== 'undefined';
let LANG = (() => {
  if (!HAS_DOM) return 'en';
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'zh') return q;
  try { const s = localStorage.getItem('learn-lang'); if (s === 'en' || s === 'zh') return s; } catch (e) {}
  return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
})();
const tx = (en, zh) => LANG === 'zh' ? zh : en;
const L = a => a[LANG === 'zh' ? 1 : 0];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const UI = {
  h1: ['How search works: the inverted index', '搜索是怎么工作的：倒排索引'],
  scenario: ['Scenario:', '场景：'],
  how: ['? How to read this', '? 怎么看这一页'],
  prev: ['← Back', '← 上一步'],
  keys: ['← → keys work too', '也可以用 ← → 键'],
  docsTitle: ['Documents', '文档'],
  indexTitle: ['Inverted index', '倒排索引'],
  queryTitle: ['Search', '搜索'],
  tryTitle: ['Try your own search', '自己搜一搜'],
  tryHint: ['Searches the 4 example documents D1–D4. Words with spaces = AND. Use OR for either word. Put words in quotes for a phrase.',
    '在 D1–D4 这 4 篇示例文档里搜索。用空格隔开 = 同时包含（AND）；用“或”= 任一个（OR）；加引号 = 词组。'],
  howTitle: ['How to read this page', '怎么看这一页'],
  gotIt: ['Got it', '知道了'],
  howBody: [`<p>A search engine cannot read every page each time you search. Instead, it builds an <b>inverted index</b> ahead of time: for every word, a list of the documents that contain it. This page builds one, step by step, then uses it.</p>
<div class="legend"><div style="background:var(--c1)"><b>Documents</b><br>the texts being searched</div><div style="background:var(--c2)"><b>Inverted index</b><br>word → list of documents</div><div style="background:var(--c3)"><b>Search</b><br>what the engine does with your words</div></div>
<p>Press <b>Next</b> to go one step at a time. What changed in the step is highlighted in yellow. On a phone, use the three tabs to switch panels; a yellow dot marks a tab that changed.</p>
<p>Tap any <span class="term" data-term="dotted" tabindex="0">underlined word</span> to see what it means. Pick another scenario from the menu at the top, and type your own search in the box at the bottom.</p>`,
    `<p>搜索引擎不可能在每次搜索时把所有网页都读一遍。它会提前建好一份<b>倒排索引</b>：每个词对应一张“包含这个词的文档”清单。这一页一步一步地建一份索引，然后用它来搜索。</p>
<div class="legend"><div style="background:var(--c1)"><b>文档</b><br>被搜索的文字</div><div style="background:var(--c2)"><b>倒排索引</b><br>词 → 文档清单</div><div style="background:var(--c3)"><b>搜索</b><br>搜索引擎拿你的词做了什么</div></div>
<p>按<b>下一步</b>一步一步往下看。每一步中变化的地方用黄色标出。在手机上，用三个标签切换面板；有黄点的标签表示那里有变化。</p>
<p>点击任何<span class="term" data-term="dotted" tabindex="0">带下划线的词</span>查看它的意思。可以从顶部菜单换一个场景，也可以在页面最下面自己输入搜索词。</p>`],
};
const U = k => L(UI[k]);

// ---------- glossary ----------
const GLOSS = {
  en: {
    dotted: ['Like this', 'Tap any underlined word to see what it means. Tap anywhere else or press Esc to close.'],
    'inverted-index': ['Inverted index', 'A table that goes from each word to the documents containing it. A document goes the other way, from the document to its words, which is why this is called "inverted". It works like the index at the back of a book.'],
    document: ['Document', 'One thing a search can return: a web page, an email, a product, a note. Each one gets a number, its document ID.'],
    'doc-id': ['Document ID', 'The number given to each document (D1, D2, …). The index stores these small numbers, not copies of the documents.'],
    tokenize: ['Tokenize', 'Cut text into separate words (tokens). In English, spaces and punctuation show where words end.'],
    segmentation: ['Word segmentation', 'Chinese is written without spaces, so a program has to decide where each word starts and ends, using a dictionary or a trained model. A simpler trick is to index every pair of neighbouring characters ("bigrams").'],
    normalize: ['Normalize', 'Make different forms of the same word look identical before indexing, e.g. "The" → "the". Real engines also turn "dogs" into "dog" (stemming).'],
    stopword: ['Stop word', 'A very common word such as "the", "a" or "and", found in almost every text, so it does not help find anything. Many indexes skip it.'],
    term: ['Term', 'A word after clean-up, exactly as it is stored in the index.'],
    dictionary: ['Dictionary', 'The sorted list of every term in the index (the left column). Because it is sorted, a term can be found in a few jumps, like looking up a word in a paper dictionary.'],
    postings: ['Postings list', 'For one term: the list of documents that contain it, sorted by document ID, often with the positions where it appears.'],
    position: ['Position', 'Where a word sits in a document: the first word is position 0, the next is 1, and so on. Positions make phrase search possible.'],
    df: ['Document frequency (df)', 'How many documents contain the term, which is the length of its postings list.'],
    tf: ['Term frequency (tf)', 'How many times a term appears in one document.'],
    idf: ['Inverse document frequency (idf)', 'How rare a term is: log(N ÷ df), where N is the number of documents. A word that is in every document gets 0; a rare word gets a high number.'],
    'tf-idf': ['tf × idf', 'A simple relevance score: a document scores higher when it uses the search words often (tf) and those words are rare (idf). The scores of all search words are added up.'],
    bm25: ['BM25', 'The ranking formula most search engines use today. It is tf × idf with two fixes: repeating a word helps less and less, and long documents do not win just for being long.'],
    intersect: ['AND (intersection)', 'Keep only the documents that are in every list.'],
    union: ['OR (union)', 'Keep the documents that are in any of the lists.'],
    phrase: ['Phrase search', 'Search for words that stand next to each other, in that order. Usually written in quotes: "red cat".'],
    tombstone: ['Deletion mark', 'Instead of removing a deleted document from every list right away, the index keeps a short list of deleted IDs and hides them from results.'],
    merge: ['Merge', 'A background clean-up that rewrites postings lists without the deleted documents and joins small pieces of the index into bigger ones.'],
    'full-scan': ['Full scan', 'Reading every word of every document to answer a search. Simple, but the work grows with the size of the whole collection.'],
    'binary-search': ['Binary search', 'Finding something in a sorted list by looking in the middle and throwing away the half that cannot contain it, again and again. A million terms need only about 20 looks.'],
  },
  zh: {
    dotted: ['就像这样', '点击任何带下划线的词，查看它的意思。点击其他地方或按 Esc 关闭。'],
    'inverted-index': ['倒排索引', '一张从“词”查到“包含这个词的文档”的表。文档本身是反过来的：从文档查到它有哪些词，所以叫“倒排”。它就像书后面的索引。'],
    document: ['文档', '搜索能返回的一个东西：一个网页、一封邮件、一件商品、一条笔记。每个文档有一个编号，叫文档编号。'],
    'doc-id': ['文档编号', '给每个文档的号码（D1、D2……）。索引里存的是这些小号码，而不是文档的副本。'],
    tokenize: ['切词', '把一段文字切成一个个单独的词（也叫分词）。英文靠空格和标点就能知道词在哪里结束。'],
    segmentation: ['中文分词', '中文词与词之间没有空格，程序要借助词典或训练好的模型来判断每个词从哪里开始、到哪里结束。更简单的办法是把每两个相邻的字都当成一个词来索引（二元切分）。'],
    normalize: ['规范化', '把同一个词的不同写法变成一样，再放进索引。比如英文把 “The” 变成 “the”，把 “dogs” 变成 “dog”。'],
    stopword: ['停用词', '非常常见的词，比如“的”“在”“也”，几乎每段文字都有，对找东西没有帮助。很多索引直接跳过它们。'],
    term: ['词项', '清理之后、真正存进索引的词。'],
    dictionary: ['词典', '索引里所有词项排好序的清单（左边那一列）。因为排好了序，几步就能找到一个词，就像查纸质词典一样。'],

function qTokens(s, start = 0) {

      for (let i = 0; i < run.length;) {

}
function docsHtml(s) {

  return o.ids.map(id => {

}

  const n = steps.length;
  if (cur === 0) return `<div class="n">${tx('Starting point', '起点')}</div><h2>${L(scen.name)}</h2><p>${L(scen.intro)}</p><div class="tip-box">💡 ${scen.start().takeaway}</div>`;
  if (cur === last()) return `<div class="n">${tx('Wrap-up', '总结')}</div><h2>${tx('What this showed', '这一部分讲了什么')}</h2>${scen.wrap()}<div class="tip-box">${tx('Try another scenario from the menu at the top, or type your own search at the bottom of the page.', '从顶部菜单换一个场景试试，或者在页面最下面自己输入搜索词。')}</div>`;
  const st = steps[cur - 1];
  return `<div class="n">${tx(`Step ${cur} of ${n}`, `第 ${cur} 步，共 ${n} 步`)}</div><h2>${st.title}</h2><p>${st.story}</p><div class="tip-box">💡 ${st.takeaway}</div>`;
}

// ---------- your own search ----------
const EXAMPLES = { en: ['cat', 'red cat', 'fox OR ball', '"red cat"', 'dogs', 'the sun'], zh: ['猫', '红色 猫', '狐狸 或 球', '“红色的猫”', '红色猫', '阳光'] };
function tryHtml(text) {
  const q = parseQuery(text); if (!q) return '';
  const ix = buildIndex(BASE), r = runQuery(q, ix);
  const mode = { and: tx('Read as AND: every word must appear.', '理解为 AND：每个词都要有。'), or: tx('Read as OR: any word is enough.', '理解为 OR：有任何一个词就行。'), phrase: tx('Read as a phrase: words side by side, in this order.', '理解为词组：按这个顺序紧挨着。') }[q.mode];
  let h = `<div class="how">${mode}</div>`;
  for (const t of q.toks) h += `<div class="cmp">${kw(t.w)} → ${!t.term ? tx('stop word, skipped', '停用词，跳过') : ix.has(t.term) ? `${t.term !== t.w ? kw(t.term) + ' ' : ''}${docsOf(ix, t.term).map(d => `<span class="pg">${Dn(d)}</span>`).join('')}` : tx('not in the index', '索引里没有')}</div>`;
  if (!r.terms.length) return h + `<div class="res">${tx('Only stop words: nothing to search for.', '只有停用词：没有可搜的。')}</div>`;
  h += `<div class="res">${r.hits.length ? tx(`${r.hits.length} found, best first:`, `找到 ${r.hits.length} 篇，按相关度排序：`) : tx('No document matches.', '没有匹配的文档。')}</div>`;
  return h + r.hits.map(({ d, s }) => `<div class="doc hit"><span class="score">${tx('score', '分数')} ${s.toFixed(2)}</span><span class="id">${Dn(d)}</span>${markText(docById(d), r.terms.map(t => t.term))}</div>`).join('');
}

// ---------- page ----------
const $ = s => document.querySelector(s);
const PANELS = [['docs', 'docsTitle', 'var(--c1)'], ['index', 'indexTitle', 'var(--c2)'], ['query', 'queryTitle', 'var(--c3)']];
function renderPanels() {
  const s = stateAt(cur), changed = cur === 0 || cur === last() ? [] : s.changed || [];
  $('#docs').innerHTML = docsHtml(s); $('#index').innerHTML = indexHtml(s); $('#query').innerHTML = queryHtml(s);
  $('#stabs').innerHTML = PANELS.map(([k, t, c]) => `<button type="button" data-stab="${k}" class="${k === stab ? 'on' : ''}" style="--c:${c}">${U(t)}${changed.includes(k) && k !== stab ? '<span class="hitdot"></span>' : ''}</button>`).join('');
  document.querySelectorAll('.panel').forEach(p => { p.classList.toggle('on', p.dataset.k === stab); p.classList.toggle('hitp', changed.includes(p.dataset.k)); });
}
function go(i) {
  cur = Math.max(0, Math.min(last(), i)); hideTip();
  if (cur <= steps.length) stab = stateAt(cur).focus || stab;
  $('#story').innerHTML = storyHtml(); renderPanels();
  $('#dots').innerHTML = Array.from({ length: last() + 1 }, (_, k) => `<button type="button" class="dot${k < cur ? ' done' : k === cur ? ' cur' : ''}" data-step="${k}" title="${k === 0 ? tx('Start', '开始') : k === last() ? tx('Wrap-up', '总结') : esc(steps[k - 1].short || '')}"></button>`).join('');
  $('#pos').textContent = cur === 0 ? tx('Start', '开始') : cur === last() ? tx('Wrap-up', '总结') : `${cur} / ${steps.length}`;
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === last();
  $('#next').textContent = cur === 0 ? tx('Start →', '开始 →') : cur === last() ? tx('Done ✓', '完成 ✓') : tx('Next →', '下一步 →');
  const r = $('#story').getBoundingClientRect();
  if (r.top < 0 || r.top > innerHeight * 0.6) window.scrollTo({ top: $('#story').offsetTop - 8, behavior: 'smooth' });
}
function applyLang() {
  document.documentElement.lang = isZh() ? 'zh-Hans' : 'en';
  document.title = tx('How search works: the inverted index', '搜索是怎么工作的：倒排索引');
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = U(el.dataset.t); });
  $('#lang').value = LANG;
  $('#scen').innerHTML = SCENARIOS.map(s => `<option value="${s.id}"${s === scen ? ' selected' : ''}>${L(s.name)}</option>`).join('');
  $('#examples').innerHTML = EXAMPLES[LANG].map(e => `<button type="button" data-q="${esc(e)}">${esc(e)}</button>`).join('');
  $('#tryq').placeholder = tx('e.g. red cat', '例如：红色 猫');
}
function showTip(el) {
  const [h, d] = G()[el.dataset.term], tip = $('#tip'), host = el.closest('dialog') || document.body;
  if (tip.parentNode !== host) host.appendChild(tip);
  tip.innerHTML = `<span class="x" role="button" aria-label="close">✕</span><b>${h}</b>${d}`;
  tip.hidden = false;
  const r = el.getBoundingClientRect(), base = host === document.body ? { left: -scrollX, top: -scrollY, width: innerWidth } : host.getBoundingClientRect();
  tip.style.maxWidth = Math.min(340, base.width - 16) + 'px';
  const x = Math.max(8, Math.min(r.left - base.left, base.width - tip.offsetWidth - 8));
  tip.style.left = x + 'px'; tip.style.top = (r.bottom - base.top + 8) + 'px';
  tip.style.setProperty('--ax', Math.max(8, Math.min(tip.offsetWidth - 20, r.left - base.left - x + Math.min(r.width / 2, 30) - 6)) + 'px');
}
function hideTip() { const t = HAS_DOM && $('#tip'); if (t) t.hidden = true; }
function doTry() { $('#tryout').innerHTML = tryHtml($('#tryq').value); }
function init() {
  scen = SCENARIOS.find(s => s.id === new URLSearchParams(location.search).get('s')) || SCENARIOS[0];
  applyLang(); build(); go(+new URLSearchParams(location.search).get('step') || 0);
  $('#prev').onclick = () => go(cur - 1);
  $('#next').onclick = () => go(cur + 1);
  $('#dots').onclick = e => { const b = e.target.closest('[data-step]'); if (b) go(+b.dataset.step); };
  $('#stabs').onclick = e => { const b = e.target.closest('[data-stab]'); if (b) { stab = b.dataset.stab; renderPanels(); } };
  $('#scen').onchange = e => { scen = SCENARIOS.find(s => s.id === e.target.value); build(); go(0); };
  $('#lang').onchange = e => {
    LANG = e.target.value;
    try { localStorage.setItem('learn-lang', LANG); } catch (_) {}
    const u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null, '', u);
    applyLang(); build(); go(Math.min(cur, last()));
    $('#tryq').value = ''; $('#tryout').innerHTML = '';
  };
  $('#howBtn').onclick = () => $('#howDlg').showModal();
  $('#examples').onclick = e => { const b = e.target.closest('[data-q]'); if (b) { $('#tryq').value = b.dataset.q; doTry(); } };
  $('#tryq').oninput = doTry;
  document.addEventListener('click', e => {
    const t = e.target.closest('.term');
    if (t) { showTip(t); return; }
    if (!e.target.closest('#tip') || e.target.closest('.x')) hideTip();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hideTip();
    if (e.target.closest && e.target.closest('input, select, textarea, dialog[open]')) return;
    if (e.key === 'ArrowRight') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
    else if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('term')) showTip(e.target);
  });
  let seen = null;
  try { seen = localStorage.getItem('ii-seen-how'); localStorage.setItem('ii-seen-how', '1'); } catch (_) {}
  if (!seen) $('#howDlg').showModal();
}

if (typeof module !== 'undefined') module.exports = {
  DOCS, BASE, GLOSS, SCENARIOS, tokens, norm, buildIndex, docsOf, intersectTrace, intersect, union, phraseHits, rank, bsearch, parseQuery, runQuery,
  docsHtml, indexHtml, queryHtml, tryHtml, storyHtml, build,
  setLang: l => { LANG = l; }, setScen: id => { scen = SCENARIOS.find(s => s.id === id); build(); return steps.length; }, setCur: i => { cur = i; },
};
else init();
</script>
</body>
